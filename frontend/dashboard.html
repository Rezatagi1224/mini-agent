<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد فروش</title><style>body{font-family:tahoma;background:#f5f7fb;padding:20px}.box{background:white;border-radius:14px;padding:18px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;padding:20px;border-radius:12px;border:1px solid #ddd}button,input{padding:10px;border-radius:8px;border:1px solid #ccc}button{cursor:pointer;background:#18212f;color:white}</style></head><body><h1>داشبورد فروش</h1><input id="pass" type="password" placeholder="رمز مدیریت"><button onclick="load()">نمایش</button><div id="app"></div><script>async function load(){let r=await fetch('/admin/dashboard',{headers:{'x-admin-password':pass.value}});let d=await r.json();if(!r.ok){app.innerHTML=d.detail;return}app.innerHTML=`<div class="grid"><div class="card">کل سفارش: ${d.orders.total}</div><div class="card">در انتظار: ${d.orders.pending}</div><div class="card">تایید شده: ${d.orders.confirmed}</div><div class="card">فروش تایید شده: ${d.sales.confirmed_amount.toLocaleString()} تومان</div></div><div class="box"><h3>محصولات پرفروش</h3>${d.top_products.map(x=>x.name+' - '+x.quantity+' عدد').join('<br>')}</div>`}</script></body></html>
